version: "1.0.0"
last_updated: "2025-12-01"

policies:
  # ELB Security Policies
  ELBSecurityPolicy-2016-08:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.0", "TLSv1.1", "TLSv1.2"]
    key_exchange: ["RSA", "ECDHE"]
    notes: "Legacy policy. Supports TLS 1.0 which is deprecated."

  ELBSecurityPolicy-TLS-1-2-2017-01:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    key_exchange: ["RSA", "ECDHE"]
    notes: "TLS 1.2 only but no PQC key exchange."

  ELBSecurityPolicy-TLS-1-2-Ext-2018-06:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    key_exchange: ["RSA", "ECDHE"]
    notes: "Extended cipher suite support, no PQC."

  ELBSecurityPolicy-FS-2018-06:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    key_exchange: ["ECDHE"]
    notes: "Forward secrecy only, no PQC."

  ELBSecurityPolicy-TLS13-1-2-2021-06:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.2", "TLSv1.3"]
    key_exchange: ["ECDHE"]
    notes: "TLS 1.3 support but no PQC key exchange."

  ELBSecurityPolicy-TLS13-1-2-Res-2021-06:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.2", "TLSv1.3"]
    key_exchange: ["ECDHE"]
    notes: "Restrictive TLS 1.3 policy, no PQC."

  ELBSecurityPolicy-TLS13-1-3-2021-06:
    service: elb
    pqc_ready: false
    tls_versions: ["TLSv1.3"]
    key_exchange: ["ECDHE"]
    notes: "TLS 1.3 only, no PQC key exchange."

  ELBSecurityPolicy-TLS13-1-2-PQ-2025-09:
    service: elb
    pqc_ready: true
    tls_versions: ["TLSv1.2", "TLSv1.3"]
    key_exchange: ["ECDHE", "ML-KEM"]
    notes: "PQC hybrid key exchange (ML-KEM + ECDHE). Backwards compatible with TLS 1.2."

  ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09:
    service: elb
    pqc_ready: true
    tls_versions: ["TLSv1.2", "TLSv1.3"]
    key_exchange: ["ECDHE", "ML-KEM"]
    notes: "Restrictive PQC hybrid key exchange. Recommended for new deployments."

  # Transfer Family policies
  TransferSecurityPolicy-2018-11:
    service: transfer_family
    pqc_ready: false
    notes: "Legacy Transfer Family policy."

  TransferSecurityPolicy-2020-06:
    service: transfer_family
    pqc_ready: false
    notes: "Updated ciphers, no PQC."

  TransferSecurityPolicy-2022-03:
    service: transfer_family
    pqc_ready: false
    notes: "Modern ciphers, no PQC."

  TransferSecurityPolicy-2023-05:
    service: transfer_family
    pqc_ready: false
    notes: "Current default, no PQC."

  TransferSecurityPolicy-2024-01:
    service: transfer_family
    pqc_ready: false
    notes: "Latest non-PQC policy."

  TransferSecurityPolicy-PQ-SSH-Experimental-2023-04:
    service: transfer_family
    pqc_ready: true
    notes: "Experimental PQC SSH key exchange."

  # API Gateway policies
  TLS_1_0:
    service: api_gateway
    pqc_ready: false
    tls_versions: ["TLSv1.0", "TLSv1.1", "TLSv1.2"]
    notes: "Legacy API Gateway policy."

  TLS_1_2:
    service: api_gateway
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    notes: "Current best practice for API Gateway. No PQC yet."

  # CloudFront viewer policies
  TLSv1:
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.0", "TLSv1.1", "TLSv1.2"]
    notes: "Legacy CloudFront policy."

  TLSv1_2016:
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.0", "TLSv1.1", "TLSv1.2"]
    notes: "2016 CloudFront policy."

  "TLSv1.1_2016":
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.1", "TLSv1.2"]
    notes: "Minimum TLS 1.1."

  "TLSv1.2_2018":
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    notes: "TLS 1.2 only, 2018 ciphers."

  "TLSv1.2_2019":
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.2"]
    notes: "TLS 1.2 only, 2019 ciphers."

  "TLSv1.2_2021":
    service: cloudfront
    pqc_ready: false
    tls_versions: ["TLSv1.2", "TLSv1.3"]
    notes: "Latest CloudFront policy. TLS 1.3 support with automatic PQC negotiation for capable clients."
